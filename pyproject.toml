[project]
name = "google-accounts-mcp"
version = "0.2.0"
description = "Multi-account Google MCP server: Gmail, Calendar, Drive, Tasks, and Contacts"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Nick Engel", email = "nick@engel.au" }]
requires-python = ">=3.12"
keywords = ["mcp", "model-context-protocol", "gmail", "google-calendar", "google-drive", "google-tasks", "google-contacts", "multi-account"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Email",
]
dependencies = [
    # The kit pins the MCP SDK range (mcp<2) for every server built on it.
    # [pdf]: pdfplumber + pypdfium2 + pillow for extract_attachment_text / render_attachment_page.
    "mcp-server-kit[pdf]>=0.1,<0.2",
    "mcp[cli]>=1.0.0",
    # Credentials base class for broker-issued tokens (auth.py).
    "google-auth>=2.30",
    # Local mode: the OAuth consent flow (scripts/authorize.py, auth.py).
    "google-auth-oauthlib>=1.2.0",
    "google-api-python-client>=2.150.0",
    "google-auth-httplib2>=0.2.0",
    # OCR of scanned/image-only PDFs is delegated to the fleet xberg
    # service over HTTP (2026-08-03; was in-process rapidocr+onnxruntime,
    # ~220 MB of wheels) — httpx carries the xberg /extract call.
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/snickery/google-accounts-mcp"
Issues = "https://github.com/snickery/google-accounts-mcp/issues"

[project.scripts]
google-accounts-mcp = "google_accounts_mcp.server:main"

[project.optional-dependencies]
test = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/google_accounts_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires GMAIL_TEST_ACCOUNT (live Gmail API tests)",
]
